[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "png2jxl"
description = "Byte-exact PNG reconstruction on top of JPEG XL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow-jxl-plugin>=1.3.8"]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.16"]

[tool.maturin]
python-source = "python"
module-name = "png2jxl._preflate"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

