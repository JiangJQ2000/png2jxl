name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 5"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    env:
      PILLOW_TEST_IMAGES: ${{ github.workspace }}/.pillow/Tests/images

    steps:
      - uses: actions/checkout@v6

      - name: Check out Pillow PNG corpus
        uses: actions/checkout@v6
        with:
          repository: python-pillow/Pillow
          ref: bb1d8e8ab8d29048624d96e3ee53cecf7c13d13d
          path: .pillow
          sparse-checkout: Tests/images
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          toolchain: "1.89"
          components: rustfmt, clippy

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip ruff pytest numba

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: "1.89"
          manylinux: auto
          args: >-
            --release
            --interpreter
            ${{ runner.os == 'Windows' && 'python' || format('python{0}', matrix.python) }}

      - name: Install wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('target/wheels/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheels[0]])"

      - name: Install djxl
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: sudo apt-get update && sudo apt-get install -y libjxl-tools

      - run: pytest -q

      - name: Benchmark
        run: >-
          python tools/benchmark.py .pillow/Tests/images/hopper.png --effort 10

      - name: Python quality
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          ruff check .
          ruff format --check .

      - name: Rust quality
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Upload wheel directly
        uses: actions/upload-artifact@v7
        with:
          path: target/wheels/*.whl
          if-no-files-found: error
          archive: false