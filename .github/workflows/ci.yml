name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 5"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}${{ matrix.abi3 && ' (abi3)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.14"
            abi3: true
          - os: macos-latest
            python: "3.14"
            abi3: true
          - os: windows-latest
            python: "3.14"
            abi3: true

    runs-on: ${{ matrix.os }}

    env:
      PILLOW_TEST_IMAGES: ${{ github.workspace }}/.pillow/Tests/images

    steps:
      - uses: actions/checkout@v6

      - name: Check out Pillow PNG corpus
        uses: actions/checkout@v6
        with:
          repository: python-pillow/Pillow
          ref: bb1d8e8ab8d29048624d96e3ee53cecf7c13d13d
          path: .pillow
          sparse-checkout: Tests/images
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && !matrix.abi3
        with:
          toolchain: "1.89"
          components: rustfmt, clippy

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip ruff pytest numba

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: "1.89"
          manylinux: auto
          args: >-
            --release
            ${{ matrix.abi3 && '--features pyo3/abi3-py314' || '' }}
            --interpreter
            ${{ runner.os == 'Windows' && 'python' || format('python{0}', matrix.python) }}

      - name: Install wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('target/wheels/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheels[0]])"

      - name: Install djxl
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && !matrix.abi3
        run: sudo apt-get update && sudo apt-get install -y libjxl-tools

      - run: pytest -q

      - name: Benchmark
        run: >-
          python tools/benchmark.py .pillow/Tests/images/hopper.png --effort 10

      - name: Python quality
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && !matrix.abi3
        run: |
          ruff check .
          ruff format --check .

      - name: Rust quality
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && !matrix.abi3
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

      - name: Upload wheel directly
        uses: actions/upload-artifact@v7
        with:
          path: target/wheels/*.whl
          if-no-files-found: error
          archive: false

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qx "version = \"$version\"" Cargo.toml; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version '$version'" >&2
            exit 1
          fi

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: "1.89"
          args: --release --sdist --out dist

      - name: Upload sdist directly
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          if-no-files-found: error
          archive: false

  publish:
    name: Publish to PyPI
    needs: [test, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check distributions match tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for f in dist/*; do
            case "$f" in
              *"-$version-"* | *"-$version".*) ;;
              *) echo "unexpected distribution: $f" >&2; exit 1 ;;
            esac
          done
          ls -l dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
